name: Update World Cup Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Fixtures
        run: |
          curl -H "x-apisports-key: ${{ secrets.API_FOOTBALL_KEY }}"           "https://v3.football.api-sports.io/fixtures?league=1&season=2026"           -o api_response.json

      - name: Generate matches.json
        run: |
          python - << 'EOF'
          import json, datetime
          with open('api_response.json') as f:
              raw=json.load(f)
          with open('matches.json','w') as f:
              json.dump({
                'updated': datetime.datetime.utcnow().isoformat(),
                'matches': raw.get('response', [])
              }, f)
          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add matches.json
          git diff --cached --quiet || git commit -m "Update World Cup data"
          git push
